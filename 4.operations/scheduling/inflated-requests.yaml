apiVersion: v1
kind: Pod
metadata:
  name: inflated-requests
  labels:
    experiment: scheduling
spec:
  restartPolicy: Never
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.9
      resources:
        requests:
          cpu: "64"
          memory: 256Gi
        limits:
          cpu: "64"
          memory: 256Gi
